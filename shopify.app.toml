# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b33bb20bfbbbb8b024d2e35c30b51a61"
name = "Crosley Gift Message"
application_url = "https://crosley-gift-message.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_validations,write_orders,write_validations"
optional_scopes = [ ]
use_legacy_install_flow = false

[order.metafields.app.gift_message]
type = "multi_line_text_field"
name = "Gift message"
description = "A customer gift message captured during checkout and copied to the order."
access.admin = "merchant_read_write"
capabilities.cart_to_order_copyable = true

[shop.metafields.app.gift_message_settings]
type = "json"
name = "Gift message settings"
description = "Controls the gift-message field shown in checkout."

[shop.metafields.app.gift_message_validation_id]
type = "single_line_text_field"
name = "Gift message validation ID"
description = "Tracks the Shopify validation that enforces required gift messages."

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://crosley-gift-message.onrender.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
